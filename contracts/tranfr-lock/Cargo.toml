[package]
name = "tranfr-lock"
version = "0.1.0"
edition = "2024"

[dependencies]
ckb-std = "1.1"
since-cmp = { path = "../../reference/since-cmp-rs" }
# CKB's own blake2b (personalization "ckb-default-hash"), no_std build via
# the "ckb-contract" feature — this is the same crate ckb-std itself offers
# as an optional dependency (its "type-id" feature enables the same thing).
ckb-hash = { version = "1.1", default-features = false, features = ["ckb-contract"] }
# Pure-Rust, no_std-compatible secp256k1 (libsecp256k1 is no longer
# maintained). "ecdsa" pulls in arithmetic + ecdsa-core/algorithm, which is
# what unlocks VerifyingKey::recover_from_prehash.
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
elliptic-curve = { version = "0.14", default-features = false, features = ["sec1"] }

[features]
library = []
native-simulator = ["library", "ckb-std/native-simulator"]
